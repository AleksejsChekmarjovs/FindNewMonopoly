spring.application.name=monopoly
server.port=8080

# База данных. По умолчанию — H2 в файле ./data (ничего ставить не нужно),
# в режиме совместимости с PostgreSQL. Для боевого сервера — профиль postgres.
spring.datasource.url=jdbc:h2:file:./data/monopoly;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# Схему создают миграции Flyway (src/main/resources/db/migration), Hibernate только сверяет
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Браузер сверяет html/css/js с сервером при каждой загрузке (ответ 304, если файл не менялся),
# чтобы после обновления игры не работала старая версия клиента из кэша
spring.web.resources.cache.cachecontrol.no-cache=true
