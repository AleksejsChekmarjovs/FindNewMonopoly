# PostgreSQL. Запуск: mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Адрес и доступ — из переменных окружения DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monopoly}
spring.datasource.username=${DB_USER:monopoly}
spring.datasource.password=${DB_PASSWORD:}
