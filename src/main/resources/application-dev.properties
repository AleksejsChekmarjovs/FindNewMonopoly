# Профиль для разработки: фронтенд отдаётся прямо из исходников,
# правки в html/css/js видны после обновления страницы, без перезапуска сервера.
# Запуск: mvnw spring-boot:run -Dspring-boot.run.profiles=dev (из корня проекта)
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
